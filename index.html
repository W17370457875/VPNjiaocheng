<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>使用教程</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; }

    .topbar {
      position: sticky; top: 0; z-index: 99;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      box-shadow: 0 2px 10px rgba(0,0,0,.3);
    }
    .topbar .title { color: #fff; font-size: 17px; font-weight: 600; letter-spacing: .5px; }
    .dl-btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #fff; padding: 9px 22px; border-radius: 8px;
      text-decoration: none; font-size: 14px; font-weight: 500;
      transition: transform .2s, box-shadow .2s;
    }
    .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79,172,254,.4); }

    .pdf-container {
      width: 100%;
      max-width: 1000px;
      height: 85vh;
      margin: 25px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      overflow: hidden;
    }

    /* 关键：使用 object 标签，兼容性最好 */
    .pdf-object {
      width: 100%;
      height: 100%;
      border: none;
    }

    .footer {
      text-align: center; padding: 20px;
      color: #666; font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="title">📘 使用教程</span>
    <a class="dl-btn" href="使用教程.pdf" download="使用教程.pdf">⬇ 下载 PDF</a>
  </div>

  <div class="pdf-container">
    <!-- 这里用 object 标签代替 iframe，通常能解决只显示一页的问题 -->
    <object 
      class="pdf-object"
      data="使用教程.pdf"
      type="application/pdf">
      
      <!-- 备用方案：如果浏览器不支持 PDF 显示 -->
      <p style="padding:40px;text-align:center;color:#666;">
        您的浏览器不支持直接预览 PDF。<br>
        <a href="使用教程.pdf" style="color:#4facfe;">点击这里下载文件</a>
      </p>
      
    </object>
  </div>

  <div class="footer">
    页面已启用 HTTPS 安全连接 · 支持在线阅读与下载
  </div>

</body>
</html>
