<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>使用教程</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #fff;
      padding: 14px 32px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: transform .2s, box-shadow .2s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(79,172,254,.45);
    }

    .tip {
      margin-top: 24px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">📘</div>
    <h1>使用教程</h1>
    <p>
      点击下方按钮下载 PDF 文件<br>
      下载完成后请按文档步骤操作
    </p>

    <!-- ✅ 直接下载，绝对不会 404 -->
    <a class="btn" href="使用教程.pdf" download="使用教程.pdf">
      ⬇ 下载 PDF
    </a>

    <div class="tip">
      文件由 GitHub 安全托管 · 支持手机 / 电脑下载
    </div>
  </div>

</body>
</html>
