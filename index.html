<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>使用教程</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f7fa; }

    .topbar {
      position: sticky; top: 0; z-index: 99;
      background: #1a1a2e;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
    }
    .topbar .title { color: #fff; font-size: 16px; font-weight: 600; }
    .dl-btn {
      background: #4f8cff; color: #fff;
      padding: 8px 18px; border-radius: 6px;
      text-decoration: none; font-size: 14px;
    }
    .dl-btn:hover { background: #3a70db; }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
      overflow: hidden;
    }

    .viewer {
      width: 100%;
      height: 80vh;
    }
    .viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .footer {
      text-align: center;
      padding: 14px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="title">📘 使用教程</span>
    <a class="dl-btn" href="使用教程.pdf" download="使用教程.pdf">⬇ 下载 PDF</a>
  </div>

  <div class="container">
    <div class="viewer">
      <iframe src="使用教程.pdf"></iframe>
    </div>
  </div>

  <div class="footer">
    本页面仅供学习与技术交流使用 · GitHub Pages 托管
  </div>

</body>
</html>
