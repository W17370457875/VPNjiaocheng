<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>使用教程</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    .topbar {
      position: sticky; top: 0; z-index: 99;
      background: #1a1a2e;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
    }
    .topbar .title { color: #fff; font-size: 16px; font-weight: 600; }
    .dl-btn {
      background: #4f8cff; color: #fff;
      padding: 8px 18px; border-radius: 6px;
      text-decoration: none; font-size: 14px;
    }
    .dl-btn:hover { background: #3a70db; }

    iframe {
      width: 100%;
      height: calc(100vh - 56px);
      border: none;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="title">📘 使用教程</span>
    <a class="dl-btn" href="使用教程.pdf" download="使用教程.pdf">⬇ 下载 PDF</a>
  </div>

  <!-- ✅ 关键：用 pdf.js 打开 -->
  <iframe
    src="web/viewer.html?file=../使用教程.pdf">
  </iframe>

</body>
</html>
