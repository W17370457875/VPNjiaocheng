<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>使用教程</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f7fa; }

    .topbar {
      position: sticky; top: 0; z-index: 99;
      background: #1a1a2e;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
    }
    .topbar .title { color: #fff; font-size: 16px; font-weight: 600; }
    .dl-btn {
      background: #4f8cff; color: #fff;
      padding: 8px 18px; border-radius: 6px;
      text-decoration: none; font-size: 14px;
    }
    .dl-btn:hover { background: #3a70db; }

    .viewer {
      width: 100%;
      max-width: 1100px;
      height: 85vh;
      margin: 20px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .footer {
      text-align: center; padding: 20px;
      color: #666; font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="title">📘 使用教程</span>
    <a class="dl-btn" href="使用教程.pdf" download="使用教程.pdf">⬇ 下载 PDF</a>
  </div>

  <!-- ✅ 关键：用 CDN 加载 pdf.js，不需要你下载任何东西 -->
  <div class="viewer">
    <iframe
      src="https://mozilla.github.io/pdf.js/web/viewer.html?file=使用教程.pdf">
    </iframe>
  </div>

  <div class="footer">
    本页面支持在线阅读与下载 · 安全托管
  </div>

</body>
</html>
